services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gaint_interns}
      POSTGRES_USER: ${POSTGRES_USER:-gaint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gaint}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gaint_interns}
      APP_NAME: ${APP_NAME:-GAINT Interns Hub}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.production}
      SEED_DEMO_DATA: "false"
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Set BOOTSTRAP_ADMIN_EMAIL in .env.production}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in .env.production}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL in .env.production}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?Set PUBLIC_API_URL in .env.production}
      TOKEN_EXPIRE_HOURS: ${TOKEN_EXPIRE_HOURS:-24}
      VSCODE_TOKEN_DAYS: ${VSCODE_TOKEN_DAYS:-0}
      WORKSPACE_BOOTSTRAP_MINUTES: ${WORKSPACE_BOOTSTRAP_MINUTES:-43200}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-demo}
      VERIFICATION_MODE: ${VERIFICATION_MODE:-demo}
      DEMO_VERIFICATION_CODE: ${DEMO_VERIFICATION_CODE:-123456}
      JUDGE0_URL: ${JUDGE0_URL:-https://ce.judge0.com}
      JUDGE0_AUTH_HEADER: ${JUDGE0_AUTH_HEADER:-X-Auth-Token}
      JUDGE0_AUTH_TOKEN: ${JUDGE0_AUTH_TOKEN:-}
      JUDGE0_PYTHON_ID: ${JUDGE0_PYTHON_ID:-109}
      JUDGE0_JAVASCRIPT_ID: ${JUDGE0_JAVASCRIPT_ID:-63}
      JUDGE0_JAVA_ID: ${JUDGE0_JAVA_ID:-62}
      CERTIFICATE_VERIFY_BASE_URL: ${CERTIFICATE_VERIFY_BASE_URL:?Set CERTIFICATE_VERIFY_BASE_URL in .env.production}
      AI_PROVIDER: ${AI_PROVIDER:-safe-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      AI_CHAT_DAILY_LIMIT: ${AI_CHAT_DAILY_LIMIT:-30}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-25}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    volumes:
      - uploads_data:/app/backend/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - internal

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_CERTIFICATE_VERIFY_BASE_URL: /api/certificates/verify
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

volumes:
  postgres_data:
  uploads_data:

networks:
  internal:
